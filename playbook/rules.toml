version = 1

[[rule]]
id = "no-dme-ime"
kind = "forbid"
severity = "error"
unit = "text"
patterns = ['\bDME\b', '\bIME\b', '\bindependent medical examinations?\b', '\bdefense medical examinations?\b']
rule = 'Never name the exam as a DME or IME in any form; write "the report".'
why = "The labels frame the examiner as independent or as the defense's; the report speaks for itself."
good = "The report of 14 March 2025 records a normal gait."
bad = "The IME found a normal gait."
added = 2026-10-25
learned = "spec §4 rule 5; ledger Q16"

[[rule]]
id = "no-hired-paid-retained"
kind = "forbid"
severity = "error"
unit = "text"
patterns = ['\b(hired|hires|hiring|retained|retains|retaining)\b', '\b(paid|pays|paying|payment|compensat(ed|ion)) (for|by|to) (the )?(doctor|dr\.?|examiner|exam|examination|report)\b', '\bwho (pays|paid|hired|retained|referred)\b', '\breferred (by|to) (the )?(defense|employer|insurer|carrier)\b', '\bfees?\b', '\bhow many (of these )?(exams|examinations|reports)\b', '\b(exams?|examinations?|reports?) (per|a|each) (year|month|week)\b']
rule = "Never ask or write who hired, paid or retained the doctor, the fees, or the exam volume."
why = "Address the report's reasoning and medical support."
good = "Which finding supports your conclusion?"
bad = "What fees did you receive for the report?"
added = 2026-10-25
learned = "spec §4 rule 5"

[[rule]]
id = "treatment-and-bills-apart"
kind = "conjunction"
severity = "error"
unit = "question"
all_of = [['\btreat(ment|ed|ing|s)?\b', '\btherapy\b', '\bsurgery\b'], ['\bbill(s|ing|ed)?\b', '\bcharges?\b', '\binvoices?\b', '\bpaid\b']]
rule = "Treatment and bills are never in one question."
why = "Separate questions give each topic a clear answer."
good = "What treatment did you receive?"
bad = "What treatment did you receive and what bills followed?"
added = 2026-10-25
learned = "spec §4 rule 5"

[[rule]]
id = "bates-cites"
kind = "cite"
severity = "error"
unit = "text"
cite_pattern = '\[(?:cite|p\.|page)\s*([^\]]*)\]'
bates_pattern = '[A-Z]{1,8}[ -]?\d{4,}'
rule = "Cite by Bates number; when the records are not stamped, cite page IDs and expect a warning."
why = "A single stable page identifier lets the reader locate the source."
good = "The report records a normal gait. [cite ABC0001]"
bad = "The report records a normal gait. [cite p. 12]"
added = 2026-10-25
learned = "spec §4 rule 5; ledger Q21"
