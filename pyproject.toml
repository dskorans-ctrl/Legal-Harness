[project]
name = "casefile"
version = "0.1.0"
description = "Local case system for one attorney (stage 1 skeleton)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=13,<14",
    "pypdf>=6.21,<7",
]

[project.scripts]
casefile = "casefile.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --strict-markers"
markers = ["socket: binds or connects to 127.0.0.1"]
